name: Gemini live smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gemini-live-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build minimal review context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .review-context
          cat > .review-context/session-plan.json <<'JSON'
          {"decision":{"mode":"discovery"},"session":null}
          JSON
          cat > .review-context/pr.json <<'JSON'
          {"number":999,"title":"Gemini live smoke","body":"Minimal API connectivity check"}
          JSON
          cat > .review-context/pr.diff <<'DIFF'
          diff --git a/smoke.txt b/smoke.txt
          new file mode 100644
          --- /dev/null
          +++ b/smoke.txt
          @@ -0,0 +1 @@
          +smoke
          DIFF

      - name: Call configured Gemini reviewer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_REPO: Jiaze-Li/claude-review-bot
          PR_NUMBER: "999"
          HEAD_SHA: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          REVIEW_CONTEXT_DIR: .review-context
          REVIEW_OUTPUT_PATH: .review-context/review.json
        run: node scripts/run-gemini-review.mjs

      - name: Validate structured result
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const r = JSON.parse(fs.readFileSync('.review-context/review.json', 'utf8'));
          if (!r || typeof r.summary !== 'string' || !Array.isArray(r.findings)) {
            throw new Error('Gemini smoke test did not produce structured review output');
          }
          if (r?._meta?.provider !== 'gemini') throw new Error('Wrong provider metadata');
          if (r?._meta?.resolved_model !== 'gemini-3.8-flash') throw new Error('Wrong Gemini model');
          if (r?._meta?.effort !== 'low') throw new Error('Wrong thinking effort');
          console.log('Gemini live smoke test passed');
          NODE
