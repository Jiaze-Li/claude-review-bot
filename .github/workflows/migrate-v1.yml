name: Migrate review state v1 to v2 (one-time)

# ONE-TIME cut-over helper. Dry-run unless apply=true. The App token writes the comment, so it stays bot-authored.
# Delete this workflow and scripts/migrate-v1.mjs once every open PR is migrated. See docs/review-contract.md.

on:
  workflow_dispatch:
    inputs:
      target_repo: { description: owner/repo, required: true, type: string }
      pr_number: { description: Pull request number, required: true, type: string }
      apply: { description: 'true to write; anything else is a dry-run', required: false, default: 'false', type: string }

permissions:
  contents: read

concurrency:
  group: independent-review-${{ inputs.target_repo }}-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Parse target repository
        id: target
        shell: bash
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          set -euo pipefail
          owner="${TARGET_REPO%%/*}"; repo="${TARGET_REPO#*/}"
          [[ -n "$owner" && -n "$repo" && "$owner" != "$repo" && "$repo" != */* ]] || { echo "Invalid target_repo" >&2; exit 1; }
          echo "owner=$owner" >> "$GITHUB_OUTPUT"; echo "repo=$repo" >> "$GITHUB_OUTPUT"
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.repo }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: read
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund --omit=dev
      - name: Migrate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_REPO: ${{ inputs.target_repo }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_REVIEW_AUTHOR: ${{ steps.app-token.outputs.app-slug }}[bot]
          APPLY: ${{ inputs.apply }}
        run: |
          if [[ "$APPLY" == "true" ]]; then node scripts/migrate-v1.mjs --apply; else node scripts/migrate-v1.mjs; fi
