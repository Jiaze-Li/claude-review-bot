name: Deterministic trigger and status tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # MCP Handler tests import the real SDK and zod. Install pinned
      # dependencies; no Claude credentials or paid model calls are used.
      - run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Syntax-check review service scripts
        run: |
          node --check worker/src/index.js
          node --check worker/src/review-trigger.js
          node --check scripts/review-status.mjs
          node --check scripts/review-session-core.mjs
          node --check scripts/plan-review-session.mjs
          node --check scripts/recover-review-session.mjs
          node --check scripts/detect-review-risk.mjs
          node --check scripts/run-gemini-review.mjs
          node --check scripts/run-review.mjs
          node --check scripts/provider-adapter.mjs
          node --check scripts/tool-gateway.mjs
          node --check scripts/validate-gemini-findings.mjs
          node --check scripts/publish-gemini-review.mjs
          node --check scripts/publish-review.mjs
          node --check scripts/github-review-api.mjs
          node --check scripts/apply-override.mjs
  # Disposable job in PR #64 only. This definition is NOT part of PR4 or main.
  live-gateway-smoke:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.number == 64 && github.event.pull_request.head.ref == 'test/pr4-live-mcp-smoke-20261106' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: One-time Claude SDK MCP Read and Grep validation (max $0.45)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/smoke-mcp-gateway.mjs
