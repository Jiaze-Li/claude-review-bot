name: Delivery v1 Review
run-name: Delivery review ${{ inputs.target_repo }}#${{ inputs.pr_number }} trigger ${{ inputs.source_comment_id }}

# Opt-in two-run review (label: delivery-v1). Dispatched only by the webhook Worker for PRs that carry the label or
# already have a delivery state comment. State lives in ONE bot comment (<!-- agent-delivery:v1 -->); see docs/delivery-v1.md.

on:
  workflow_dispatch:
    inputs:
      target_repo: { description: owner/repo containing the pull request, required: true, type: string }
      pr_number: { description: Pull request number, required: true, type: string }
      base_sha: { description: PR base SHA captured by the webhook, required: true, type: string }
      head_sha: { description: PR head SHA captured by the webhook, required: true, type: string }
      trigger_user: { description: GitHub login that caused the event, required: true, type: string }
      source_comment_id: { description: Trigger ID for traceability only, required: true, type: string }
      source_kind: { description: comment or pull_request, required: false, default: comment, type: string }
      requested_mode: { description: Informational only (every trigger means ensure a result for HEAD), required: false, default: auto, type: string }

permissions:
  contents: read

concurrency:
  # The SAME group as review-v2.yml: legacy and delivery runs for one PR are serialized against each other.
  group: independent-review-${{ inputs.target_repo }}-${{ inputs.pr_number }}
  cancel-in-progress: false
  queue: max

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # keep above the run's own time limit; IN_PROGRESS_TIMEOUT_MS (45 min) is larger still
    steps:
      - name: Checkout trusted control repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Parse target repository
        id: target
        shell: bash
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          set -euo pipefail
          owner="${TARGET_REPO%%/*}"
          repo="${TARGET_REPO#*/}"
          if [[ -z "$owner" || -z "$repo" || "$owner" == "$repo" || "$repo" == */* ]]; then
            echo "Invalid target_repo: $TARGET_REPO" >&2
            exit 1
          fi
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: Create least-privilege GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.repo }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: read

      - name: Create best-effort commit-status token
        id: status-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.repo }}
          permission-statuses: write

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund --omit=dev

      - name: Decide whether a model run is needed (no side effects)
        id: plan
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_REPO: ${{ inputs.target_repo }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          EXPECTED_REVIEW_AUTHOR: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: node scripts/delivery-review.mjs plan

      - name: Checkout exact PR head temporarily
        if: steps.plan.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.head_sha }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 1
          path: target
          persist-credentials: false

      - name: Build exact PR review context
        if: steps.plan.outputs.run == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          TARGET_REPO: ${{ inputs.target_repo }}
          PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p .review-context
          gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json number,title,body,author,baseRefName,headRefName,baseRefOid,headRefOid > .review-context/pr.json
          [[ "$(jq -r '.headRefOid' .review-context/pr.json)" == "$HEAD_SHA" ]] || { echo "PR head moved before review started" >&2; exit 1; }
          merge_base="$(gh api "repos/${TARGET_REPO}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '.merge_base_commit.sha')"
          [[ "$merge_base" =~ ^[0-9a-f]{40}$ ]] || { echo "GitHub did not return a valid merge-base SHA" >&2; exit 1; }
          if ! git -C target cat-file -e "${merge_base}^{commit}" 2>/dev/null; then
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
              git -C target fetch --no-tags --depth=1 origin "$merge_base"
          fi
          git -C target diff --no-ext-diff --no-textconv --unified=80 "$merge_base" "$HEAD_SHA" > .review-context/pr.diff
          git -C target diff --no-ext-diff --no-textconv --name-only "$merge_base" "$HEAD_SHA" > .review-context/changed-files.txt
          git -C target diff --no-ext-diff --no-textconv --stat "$merge_base" "$HEAD_SHA" > .review-context/diff-stat.txt
          # Skip list comes from the PR's BASE commit, never from the PR itself.
          { git -C target show "${merge_base}:.reviewbotignore" 2>/dev/null | head -c 20000 > .review-context/ignore-patterns.txt; } || true
          [[ -f .review-context/ignore-patterns.txt ]] || : > .review-context/ignore-patterns.txt

      - name: Materialize safe source snapshot
        if: steps.plan.outputs.run == 'true'
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          SOURCE_REPO_DIR: target
          OUTPUT_DIR: safe-target
          REVIEW_CONTEXT_DIR: .review-context
        run: node scripts/materialize-safe-tree.mjs

      # Always runs after the plan: it re-reads the PR and the state comment, then reuses, stops, or (only if still
      # needed and allowed) takes the run slot durably BEFORE calling the single configured provider.
      - name: Run or reuse the delivery review
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STATUS_TOKEN: ${{ steps.status-token.outputs.token }}
          STATUS_STRICT: ${{ vars.REQUIRE_STATUS_CHECK }}
          TARGET_REPO: ${{ inputs.target_repo }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          EXPECTED_REVIEW_AUTHOR: ${{ steps.app-token.outputs.app-slug }}[bot]
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DELIVERY_PROVIDER: ${{ vars.DELIVERY_PROVIDER }}
          DELIVERY_MAX_TURNS: ${{ vars.DELIVERY_MAX_TURNS }}
          DELIVERY_MAX_BUDGET_USD: ${{ vars.DELIVERY_MAX_BUDGET_USD }}
          DELIVERY_TIMEOUT_MS: ${{ vars.DELIVERY_TIMEOUT_MS }}
          SAFE_REPO_DIR: safe-target
          REVIEW_CONTEXT_DIR: .review-context
        run: node scripts/delivery-review.mjs run
