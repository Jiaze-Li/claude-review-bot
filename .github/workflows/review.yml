name: Legacy Review Entry

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: owner/repo containing the pull request
        required: true
        type: string
      pr_number:
        description: Pull request number
        required: true
        type: string
      base_sha:
        description: Exact PR base SHA captured by the webhook
        required: true
        type: string
      head_sha:
        description: Exact PR head SHA captured by the webhook
        required: true
        type: string
      trigger_user:
        description: GitHub login that requested the review
        required: true
        type: string
      source_comment_id:
        description: Trigger comment ID for traceability and idempotency
        required: true
        type: string

jobs:
  review:
    uses: ./.github/workflows/review-v2.yml
    with:
      target_repo: ${{ inputs.target_repo }}
      pr_number: ${{ inputs.pr_number }}
      base_sha: ${{ inputs.base_sha }}
      head_sha: ${{ inputs.head_sha }}
      trigger_user: ${{ inputs.trigger_user }}
      source_comment_id: ${{ inputs.source_comment_id }}
      requested_mode: auto
    secrets: inherit
